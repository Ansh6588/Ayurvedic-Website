<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/nav.css">
    <title>Home</title>
    <style>
        /* Hover effect for the Login link */
        .nav2 a:hover {
            text-decoration: underline;
            cursor: pointer;
        }

        /* Styling the modal */
        .modal-backdrop {
            z-index: 1040 !important;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="nav1">
            <nav>
                <a href="home.html">Home</a>
                <a href="home.html">Consultation</a>
                <a href="home.html">Products</a>
                <a href="home.html">Courses</a>
                <a href="home.html">Job Opportunities</a>
            </nav>
        </div>
        <div class="logo">
            <img src="image/logo.png" alt="Logo">
        </div>
        <div class="nav2">
            <nav>
                <a href="home.html">Wholesale</a>
                <a href="home.html">Location</a>
                <a href="newsletter.html">Newsletter</a>
                <a href="community.html">Community</a>
                <a href="aboutUs.html">About Us</a>
                <!-- Adding Login and Register links -->
           
            </nav>
        </div>
        <div class="login-register">
            <!-- Adding Login and Register links as a separate entity -->
            <a href="#" data-bs-toggle="modal" data-bs-target="#loginModal">Login</a>
            <a href="register.html">Register</a>
        </div>  
    </div>

    <!-- Modal for Login -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">Login</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
